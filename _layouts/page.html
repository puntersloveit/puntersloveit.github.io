---
layout: default
---
<article class="post">

  <header class="post-header">
    <h1 class="post-title"{% if page.display_title_i18n %} data-i18n="{{ page.display_title_i18n }}"{% endif %}>{{ page.display_title | default: page.title | escape }}</h1>
  </header>

  <div class="post-content">
    {{ content }}
  </div>

</article>
