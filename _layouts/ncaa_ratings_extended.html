---
layout: default
---
<link href="https://unpkg.com/tabulator-tables@5.4.3/dist/css/tabulator.min.css" rel="stylesheet">
<script src="https://unpkg.com/tabulator-tables@5.4.3/dist/js/tabulator.min.js"></script>
<style>
  .page-content > .wrapper {
    max-width: none;
    width: 100%;
    padding-right: 8px;
    padding-left: 8px;
  }

  #columnSelectors {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 8px;
    margin-bottom: 8px;
  }

  #columnSelectors label {
    white-space: nowrap;
  }

  .border-table-style tr {
    border: 3px solid gray;
    color: black;
  }

  #no-records-message {
    display: none;
    color: rgb(152, 11, 0);
  }
</style>

<h1><img src="{{ '/favicon.png' | relative_url }}" alt="" style="width:60px; height:60px; vertical-align:middle;"> <a href="{{ '/ncaa' | relative_url }}" data-i18n="extended_ncaa_title">Extended NCAA Game Ratings</a></h1>
<div id="columnSelectors">
  <label><input type="checkbox" value="season" checked> <span data-i18n="year">Year</span></label>
  <label><input type="checkbox" value="week" checked> <span data-i18n="week">Week</span></label>
  <label><input type="checkbox" value="season_type" checked> <span data-i18n="season_type">Season Type</span></label>
  <label><input type="checkbox" value="notes" checked> <span data-i18n="notes">Notes</span></label>
  <label><input type="checkbox" value="home_team" checked> <span data-i18n="home_team">Home Team</span></label>
  <label><input type="checkbox" value="away_team" checked> <span data-i18n="away_team">Away Team</span></label>
  <label><input type="checkbox" value="home_conference" checked> <span data-i18n="home_conference">Home Conference</span></label>
  <label><input type="checkbox" value="away_conference" checked> <span data-i18n="away_conference">Away Conference</span></label>
  <label><input type="checkbox" value="home_division" checked> <span data-i18n="home_division">Home Division</span></label>
  <label><input type="checkbox" value="away_division" checked> <span data-i18n="away_division">Away Division</span></label>
  <label><input type="checkbox" value="game_rating" checked> <span data-i18n="game_rating">Game Rating</span></label>
  <label><input type="checkbox" value="tds_rating" checked> <span data-i18n="tds_rating">TDs Rating</span></label>
  <label><input type="checkbox" value="sacks_rating" checked> <span data-i18n="sacks_rating">Sacks Rating</span></label>
  <label><input type="checkbox" value="interceptions_rating" checked> <span data-i18n="interceptions_rating">Interceptions Rating</span></label>
  <label><input type="checkbox" value="yards_rating" checked> <span data-i18n="yards_rating">Yards Rating</span></label>
  <label><input type="checkbox" value="stat_rating" checked> <span data-i18n="stat_rating">Stat Rating</span></label>
  <label><input type="checkbox" value="efficiency_rating" checked> <span data-i18n="efficiency_rating">Efficiency Rating</span></label>
  <label><input type="checkbox" value="overtimes_rating" checked> <span data-i18n="overtimes_rating">Overtimes Rating</span></label>
  <label><input type="checkbox" value="excitement_rating" checked> <span data-i18n="excitement_rating">Excitement Rating</span></label>
  <label><input type="checkbox" value="score_diff_rating" checked> <span data-i18n="score_diff_rating">Score Diff Rating</span></label>
  <label><input type="checkbox" value="leader_changes_rating" checked> <span data-i18n="leader_changes_rating">Leader Changes Rating</span></label>
</div>
<div id="no-records-message"></div>

<div id="NCAAGameRatingsTable"></div>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const messageElement = document.getElementById("no-records-message");
    const dataUrl = "{{ '/assets/data/ncaa_game_ratings_extended.json' | relative_url }}";
    const translate = key => window.PLI18n ? window.PLI18n.t(key) : key;
    const columnKeys = {season:"year", week:"week", season_type:"season_type", notes:"bowl_name", home_team:"home_team", away_team:"away_team", home_conference:"home_conference", away_conference:"away_conference", home_division:"home_division", away_division:"away_division", game_rating:"game_rating", tds_rating:"tds_rating", sacks_rating:"sacks_rating", interceptions_rating:"interceptions_rating", yards_rating:"yards_rating", stat_rating:"stat_rating", efficiency_rating:"efficiency_rating", overtimes_rating:"overtimes_rating", excitement_rating:"excitement_rating", score_diff_rating:"score_diff_rating", leader_changes_rating:"leader_changes_rating"};

    function initializeTable(data) {
      var table = new Tabulator("#NCAAGameRatingsTable", {
        data: data,
        layout: "fitColumns",
        pagination: "local",
        paginationSize: 20,
        paginationSizeSelector: [10, 20, 50, 100, 200, 500],
        columns: Object.entries(columnKeys).map(([field,key]) => ({
          title: translate(key), field: field,
          sorter: ["season","week"].includes(field) || field.endsWith("_rating") ? "number" : "string",
          headerFilter: ["season","week"].includes(field) || field.endsWith("_rating") ? true : "input"
        })),
      });

      const checkboxes = document.querySelectorAll("#columnSelectors input[type='checkbox']");
      checkboxes.forEach(checkbox => {
        checkbox.addEventListener("change", function () {
          const column = table.getColumn(checkbox.value);
          if (column) {
            column.toggle();
          }
        });
      });
      document.addEventListener("puntersloveit:languagechange", function () {
        Object.entries(columnKeys).forEach(([field,key]) => {
          const column = table.getColumn(field);
          if (column) column.updateDefinition({title: translate(key)});
        });
      });
    }

    fetch(dataUrl)
      .then(function (response) {
        if (!response.ok) {
          throw new Error("Failed to load NCAA extended ratings data");
        }
        return response.json();
      })
      .then(function (data) {
        initializeTable(data);
      })
      .catch(function (error) {
        messageElement.textContent = translate("unable_extended");
        messageElement.style.display = "block";
        console.error(error);
      });
  });
</script>
